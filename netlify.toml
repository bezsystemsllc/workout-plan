[build]
  command = "node scripts/check-runtime.mjs && python3 scripts/public_site.py"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"


[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/usda-foods"
  to = "/.netlify/functions/usda-foods"
  status = 200

[[redirects]]
  # Fallback: serve index.html for any unknown deep link so client-side routing keeps working
  from = "/*"
  to = "/index.html"
  status = 200
